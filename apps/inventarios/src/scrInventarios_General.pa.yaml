Screens:
  scrInventarios_General:
    Properties:
      Fill: =Tema.Fondo
      OnVisible: |-
        =Reset(txtGen_Buscar);
        If(varRol = "col" && varTabGen in ["Compras", "Movimientos"], Set(varTabGen, "Existencias"));
        Concurrent(
            // fechaaplicacion >= primer día del mes: delegable, indexada
            ClearCollect(colComprasMes, Filter(raw_inv_compra, fechaaplicacion >= Date(Year(Today()), Month(Today()), 1))),
            // envia / recibe = sucursal: delegable, indexadas
            ClearCollect(colTraspasos, Sort(Filter(raw_inv_traspaso, envia = SucursalPropia || recibe = SucursalPropia), ID, SortOrder.Descending)),
            ClearCollect(colConteosFis, Sort(raw_inv_conteo_fisico, fecha, SortOrder.Descending))
        );
        // id_traspaso in …: no delegable, pocas transferencias por sucursal
        ClearCollect(colTrfPartidas, Filter(raw_inv_traspaso_partida, id_traspaso in colTraspasos.id_raw));
        // fecha >= hoy − 7: delegable, indexada
        ClearCollect(
            colMovs,
            ForAll(
                Sort(Filter(raw_inv_movimiento, fecha >= DateAdd(Today(), -7, TimeUnit.Days)), fecha, SortOrder.Descending) As M,
                With(
                    {i: LookUp(Insumos, idinsumo = M.idinsumo)},
                    {
                        fecha: M.fecha, idinsumo: M.idinsumo, Insumo: Coalesce(i.descripcion, M.idinsumo), Ab: i.Ab,
                        idconcepto: M.idconcepto, Concepto: Coalesce(LookUp(Conceptos, idconcepto = M.idconcepto).descripcion, M.idconcepto),
                        cantidad: M.cantidad, costo: M.costo, idalmacen: M.idalmacen,
                        Almacen: LookUp(Almacenes, idalmacen = M.idalmacen).nombre, referencia: M.referencia
                    }
                )
            )
        );
        Set(varCompraSel, First(SortByColumns(Filter(colComprasMes, !cancelado), "fechaaplicacion", SortOrder.Descending)));
        Set(varConteoFisSel, First(colConteosFis));
        Set(varTrfSel, Blank())
