                          =If(
                              (CountRows(Insumos) - CountRows(colLineas)) > 0,
                              "Quedan " & (CountRows(Insumos) - CountRows(colLineas)) & " insumos vacíos; quedarán como no contados. ",
                              "Todos los insumos están contados. "
                          ) & "Después de enviar, solo el Supervisor o el Gerente de sucursal pueden editar el conteo."
                        VerticalAlign: =VerticalAlign.Top
