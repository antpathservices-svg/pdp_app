                              PaddingRight: =8
                              PressedBorderColor: =Tema.Marca
                              PressedColor: =Tema.Texto
                              PressedFill: =Tema.SuperficiePresion
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =TipoEtiqueta
                              Text: ="Cancelar"
                        - btnCntRevDlg_Enviar:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =Tema.Marca
                              Color: =Tema.Texto
                              DisabledBorderColor: =Tema.Borde
                              DisabledColor: =Tema.TextoSuave
                              DisabledFill: =Tema.SuperficiePresion
                              Fill: =Tema.Marca
                              FillPortions: =1
                              FocusedBorderColor: =Tema.Texto
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =44
                              HoverBorderColor: =Tema.MarcaHover
                              HoverColor: =Tema.Texto
                              HoverFill: =Tema.MarcaHover
