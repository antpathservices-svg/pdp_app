                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(
                                    varConteo,
                                    Patch(
                                        raw_inv_conteo_semanal,
                                        LookUp(raw_inv_conteo_semanal, id_raw = varConteoId),
                                        {estado: "Por revisar", enviadoPor: User().FullName, enviadoEl: Now(), comentario: txtCntRev_Comentario.Text}
                                    )
                                );
                                Set(varDlgRev, false);
                                Notify("Conteo enviado a revisión", NotificationType.Success);
                                Navigate(scrInventarios_Conteo, ScreenTransition.None)
                              PaddingLeft: =8
