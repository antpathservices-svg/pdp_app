            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varDlgRev
            Width: =Parent.Width
          Children:
            - conCntRev_Panel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =Tema.Borde
                  BorderThickness: =2
                  DropShadow: =DropShadow.None
