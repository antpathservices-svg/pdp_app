                  PaddingRight: =Resp(14, 22, 22)
                  PaddingTop: =Resp(14, 22, 22)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =Min(Parent.Width - 2 * Gutter, 512)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Max(Gutter, Parent.Height * 0.1)
                Children:
                  - lblCntRev_DlgTitulo:
                      Control: Label
                      Properties:
                        Color: =Tema.TextoMarca
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
