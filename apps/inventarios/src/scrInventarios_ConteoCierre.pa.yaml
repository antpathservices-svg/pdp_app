                            Properties:
                              Color: =Tema.TextoSuave
                              FocusedBorderColor: =Tema.Marca
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =TipoEtiqueta
                              Text: =ThisItem.Etiqueta
                        - lblgalCntCie_Kpis_Valor:
                            Control: Label
