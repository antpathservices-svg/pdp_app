                        PaddingLeft: =Resp(10, 14, 14)
                        PaddingRight: =Resp(10, 14, 14)
                        PaddingTop: =Resp(10, 14, 14)
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =Parent.TemplateWidth - 2 * MitadHueco
                        X: =MitadHueco
                        Y: =MitadHueco
                      Children:
                        - lblgalCntCie_Kpis_Etiqueta:
