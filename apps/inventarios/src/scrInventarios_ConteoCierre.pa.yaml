                                                - cirCntCieAl_Estado:
                                                    Control: Circle
                                                    Properties:
                                                      AccessibleLabel: |-
                                                        ="Estado: " & If(ThisItem.excede, "Excede lo disponible", ThisItem.resuelta || IsBlank(ThisItem.alerta), "Resuelta", EtiquetaAlerta(ThisItem.alerta))
