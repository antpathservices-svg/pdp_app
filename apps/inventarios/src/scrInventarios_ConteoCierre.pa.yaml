Screens:
  scrInventarios_ConteoCierre:
    Properties:
      Fill: =Tema.Fondo
      OnVisible: |-
        =Set(varDlgCie, {visible: false, tipo: "", titulo: "", idinsumo: "", ID: 0});
        Set(varDlgCieError, "");
        ClearCollect(colHist, Filter(raw_inv_conteo_semanal_historial, conteoId = varConteoId));
        // colCierre: líneas con su disponible y si quedan pendientes (UX02 §03 colPendientes; B-09 supuesto)
        ClearCollect(
            colCierre,
            ForAll(
                colLineas As L,
                With(
                    {i: LookUp(Insumos, idinsumo = L.idinsumo), rf: LookUp(colRef, idinsumo = L.idinsumo)},
                    With(
                        {disp: If(IsBlank(rf.pasada), Blank(), rf.pasada + rf.mov)},
                        {
                            ID: L.ID, idinsumo: L.idinsumo, Insumo: i.descripcion, Ab: i.Ab, Costo: i.costopromedio,
                            cantidad: L.cantidad, sinExistencia: L.sinExistencia, alerta: L.alerta, resuelta: L.resuelta,
                            resueltaPor: L.resueltaPor, pasada: rf.pasada, mov: rf.mov, disp: disp,
                            excede: !L.sinExistencia && !IsBlank(disp) && L.cantidad > disp,
                            pendiente: (!IsBlank(L.alerta) && !L.resuelta) || (!L.sinExistencia && !IsBlank(disp) && L.cantidad > disp)
                        }
                    )
                )
            )
        )
    Children:
      - conCntCie_Raiz:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Tema.Fondo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =Resp(12, 24, 32)
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =Gutter
            PaddingLeft: =MargenColumna(Parent.Width)
            PaddingRight: =MargenColumna(Parent.Width)
            PaddingTop: =Gutter
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conCntCie_Header:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =Tema.Marca
                  DropShadow: =DropShadow.None
                  Fill: =Tema.Superficie
                  FillPortions: =0
                  Height: =Resp(56, 64, 64)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                Children:
                  - btnCntCie_Regresar:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Tema.Borde
                        Color: =Tema.Texto
                        DisabledBorderColor: =Tema.Borde
                        DisabledColor: =Tema.TextoSuave
                        DisabledFill: =Tema.SuperficiePresion
                        Fill: =Tema.Fondo
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HoverBorderColor: =Tema.Marca
                        HoverColor: =Tema.Texto
                        HoverFill: =Tema.SuperficieHover
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrInventarios_Conteo, ScreenTransition.None)
                        PaddingLeft: =8
                        PaddingRight: =8
                        PressedBorderColor: =Tema.Marca
                        PressedColor: =Tema.Texto
                        PressedFill: =Tema.SuperficiePresion
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =TipoAppTitulo
                        Text: ="‹"
                        Tooltip: ="Regresar al conteo"
                        Width: =44
                  - lblCntCie_Marca:
                      Control: Label
                      Properties:
                        Color: =Tema.TextoMarca
                        FillPortions: =1
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoAppTitulo
                        Text: ="Conteo semanal"
            - conCntCie_Titulo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =(Resp(32, 38, 44)) + (24) + 1 * (4)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblCntCie_Titulo:
                      Control: Label
                      Properties:
                        Color: =Tema.Texto
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Resp(32, 38, 44)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoHero
                        Text: ="Cierre del conteo"
                  - lblCntCie_Subtitulo:
                      Control: Label
                      Properties:
                        Color: =Tema.TextoSuave
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoLead
                        Text: =If(IsBlank(varConteo.enviadoEl), "Aún no se envía a revisión", "Enviado el " & Text(varConteo.enviadoEl, "d mmm, hh:mm", "es-MX"))
            - galCntCie_Kpis:
                Control: Gallery
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Indicadores del cierre"
                  Fill: =Color.Transparent
                  FillPortions: =0
                  FocusedBorderColor: =Tema.Marca
                  FocusedBorderThickness: =2
                  Height: |-
                    =RoundUp(CountRows(Table(
                        {Etiqueta: "Insumos contados", Valor: CountRows(colLineas) & " de " & CountRows(Insumos), Detalle: (CountRows(Insumos) - CountRows(colLineas)) & " quedaron vacíos", Color: Tema.Texto},
                        {Etiqueta: "Valor del conteo", Valor: If(varRol = "col", "—", Text(Sum(colCierre, cantidad * Costo), "$#,##0")), Detalle: "Cantidad × costo promedio", Color: Tema.Texto},
                        {Etiqueta: "Alertas por resolver", Valor: Text(CountRows(Filter(colCierre, pendiente))), Detalle: "Bloquean el cierre", Color: If(CountRows(Filter(colCierre, pendiente)) > 0, Tema.Error, Tema.Exito)}
                    )) / Resp(2, 3, 3), 0) * (Resp(118, 136, 136) + 2 * MitadHueco)
                  Items: |-
                    =Table(
                        {Etiqueta: "Insumos contados", Valor: CountRows(colLineas) & " de " & CountRows(Insumos), Detalle: (CountRows(Insumos) - CountRows(colLineas)) & " quedaron vacíos", Color: Tema.Texto},
                        {Etiqueta: "Valor del conteo", Valor: If(varRol = "col", "—", Text(Sum(colCierre, cantidad * Costo), "$#,##0")), Detalle: "Cantidad × costo promedio", Color: Tema.Texto},
                        {Etiqueta: "Alertas por resolver", Valor: Text(CountRows(Filter(colCierre, pendiente))), Detalle: "Bloquean el cierre", Color: If(CountRows(Filter(colCierre, pendiente)) > 0, Tema.Error, Tema.Exito)}
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TabIndex: =0
                  TemplatePadding: =0
                  TemplateSize: =Resp(118, 136, 136) + 2 * MitadHueco
                  WrapCount: =Resp(2, 3, 3)
