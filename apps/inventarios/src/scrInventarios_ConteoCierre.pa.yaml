                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblCntCieAl_Tit:
                            Control: Label
                            Properties:
                              Color: =Tema.Texto
                              FocusedBorderColor: =Tema.Marca
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =26
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =TipoCardTit
                              Text: ="Alertas"
                        - lblCntCieAl_Sub:
                            Control: Label
                            Properties:
                              Color: =Tema.TextoSuave
                              FocusedBorderColor: =Tema.Marca
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =TipoCuerpo
                              Text: =galCntCie_Alertas.AllItemsCount & " líneas · " & CountRows(Filter(colCierre, pendiente)) & " pendientes"
                  - galCntCie_Alertas:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Alertas del conteo"
                        Fill: =Color.Transparent
                        FillPortions: =0
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Height: =galCntCie_Alertas.AllItemsCount * Resp(156, 100, 100)
                        Items: =SortByColumns(Filter(colCierre, !IsBlank(alerta) || excede), "pendiente", SortOrder.Descending, "Insumo", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TabIndex: =0
                        TemplatePadding: =0
                        TemplateSize: =Resp(156, 100, 100)
                      Children:
                        - conCntCieAl_Fila:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =Tema.Borde
                              BorderThickness: =2
                              DropShadow: =DropShadow.None
                              Fill: =Tema.Superficie
                              Height: =Parent.TemplateHeight - 8
                              LayoutAlignItems: =If(EsTelefono, LayoutAlignItems.Stretch, LayoutAlignItems.Center)
                              LayoutDirection: =If(EsTelefono, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =12
                              PaddingBottom: =8
                              PaddingLeft: =12
