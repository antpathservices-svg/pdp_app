                              FocusedBorderColor: =Tema.Marca
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =TipoDetalle
                              Text: =ThisItem.Detalle
