                                                Height: =26
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =TipoCardTit
                                                Text: =ThisItem.Insumo
                                                Wrap: =false
                                          - conCntCieAl_Estado:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorFade(ColorEstado(If(ThisItem.excede, "Excede lo disponible", ThisItem.resuelta || IsBlank(ThisItem.alerta), "Resuelta", EtiquetaAlerta(ThisItem.alerta))), 0.88)
