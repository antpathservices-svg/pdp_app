                        PressedFill: =Tema.SuperficiePresion
                        SelectionColor: =Tema.Texto
                        SelectionFill: =Tema.Marca
                        Size: =TipoCuerpo
                        Visible: =varDlgCie.tipo = "correccion"
                  - drpCieDlg_Tipo:
                      Control: Classic/DropDown
                      Properties:
                        AccessibleLabel: ="Tipo de entrada"
                        BorderColor: =Tema.Borde
                        ChevronBackground: =Tema.Superficie
                        ChevronDisabledBackground: =Tema.SuperficiePresion
                        ChevronDisabledFill: =Tema.TextoSuave
                        ChevronFill: =Tema.TextoMarca
                        ChevronHoverBackground: =Tema.SuperficieHover
                        ChevronHoverFill: =Tema.TextoMarca
                        Color: =Tema.Texto
                        DisabledBorderColor: =Tema.Borde
                        DisabledColor: =Tema.TextoSuave
                        DisabledFill: =Tema.SuperficiePresion
                        Fill: =Tema.Superficie
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HoverBorderColor: =Tema.Marca
                        HoverColor: =Tema.Texto
                        HoverFill: =Tema.SuperficieHover
                        Items: =["Transferencia de entrada", "Compra sin orden previa"]
                        Items.Value: =Value
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PressedColor: =Tema.Texto
                        PressedFill: =Tema.SuperficiePresion
                        SelectionColor: =Tema.Texto
                        SelectionFill: =Tema.Marca
                        Size: =TipoCuerpo
                        Visible: =varDlgCie.tipo = "entrada"
                  - lblCieDlg_CantEtiqueta:
                      Control: Label
                      Properties:
                        Color: =Tema.Texto
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoEtiqueta
                        Text: ="Cantidad"
                  - txtCieDlg_Cantidad:
                      Control: Classic/TextInput
                      Properties:
                        AccessibleLabel: ="Cantidad"
                        Align: =Align.Right
                        BorderColor: =Tema.Borde
                        Color: =Tema.Texto
                        Default: =""
                        DisabledBorderColor: =Tema.Borde
                        DisabledColor: =Tema.TextoSuave
                        DisabledFill: =Tema.SuperficiePresion
                        Fill: =Tema.Superficie
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Format: =TextFormat.Number
                        Height: =44
                        HoverBorderColor: =Tema.Marca
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =TipoCuerpo
                        VirtualKeyboardMode: =VirtualKeyboardMode.Numeric
                  - lblCieDlg_TextoEtiqueta:
                      Control: Label
                      Properties:
                        Color: =Tema.Texto
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoEtiqueta
                        Text: =If(varDlgCie.tipo = "entrada", "Referencia (folio de la transferencia o de la factura)", "Motivo de la corrección")
                        Visible: =varDlgCie.tipo <> "corregir"
                  - txtCieDlg_Texto:
                      Control: Classic/TextInput
                      Properties:
                        AccessibleLabel: ="Referencia o motivo"
                        BorderColor: =Tema.Borde
                        Color: =Tema.Texto
                        Default: =""
                        DisabledBorderColor: =Tema.Borde
                        DisabledColor: =Tema.TextoSuave
                        DisabledFill: =Tema.SuperficiePresion
                        Fill: =Tema.Superficie
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HoverBorderColor: =Tema.Marca
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =TipoCuerpo
                        Visible: =varDlgCie.tipo <> "corregir"
                  - lblCieDlg_Error:
                      Control: Label
                      Properties:
                        Color: =Tema.Error
                        FocusedBorderColor: =Tema.Marca
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =TipoCuerpo
                        Text: =varDlgCieError
                        Visible: =!IsBlank(varDlgCieError)
                  - conCieDlg_Acciones:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnCieDlg_Cancelar:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =Tema.Borde
                              Color: =Tema.Texto
                              DisabledBorderColor: =Tema.Borde
                              DisabledColor: =Tema.TextoSuave
                              DisabledFill: =Tema.SuperficiePresion
                              Fill: =Tema.Superficie
                              FillPortions: =1
                              FocusedBorderColor: =Tema.Marca
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =44
                              HoverBorderColor: =Tema.Marca
                              HoverColor: =Tema.Texto
                              HoverFill: =Tema.SuperficieHover
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Reset(txtCieDlg_Cantidad);
                                Reset(txtCieDlg_Texto);
                                Set(varDlgCie, {visible: false, tipo: "", titulo: "", idinsumo: "", ID: 0})
                              PaddingLeft: =8
                              PaddingRight: =8
                              PressedBorderColor: =Tema.Marca
                              PressedColor: =Tema.Texto
                              PressedFill: =Tema.SuperficiePresion
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =TipoEtiqueta
                              Text: ="Cancelar"
                        - btnCieDlg_Guardar:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =Tema.Marca
                              Color: =Tema.Texto
                              DisabledBorderColor: =Tema.Borde
                              DisabledColor: =Tema.TextoSuave
                              DisabledFill: =Tema.SuperficiePresion
                              Fill: =Tema.Marca
                              FillPortions: =1
                              FocusedBorderColor: =Tema.Texto
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =44
                              HoverBorderColor: =Tema.MarcaHover
                              HoverColor: =Tema.Texto
                              HoverFill: =Tema.MarcaHover
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    {
                                        tipo: varDlgCie.tipo,
                                        ins: LookUp(Insumos, idinsumo = If(varDlgCie.tipo = "correccion", drpCieDlg_Insumo.Selected.idinsumo, varDlgCie.idinsumo)),
                                        msg: ValidarCantidad(txtCieDlg_Cantidad.Text, true),
                                        cant: NumeroDe(txtCieDlg_Cantidad.Text)
                                    },
                                    If(
                                        tipo = "correccion" && IsBlank(ins), Set(varDlgCieError, "Elige el insumo."),
                                        !IsBlank(msg), Set(varDlgCieError, msg),
                                        tipo = "entrada" && cant <= 0, Set(varDlgCieError, "La cantidad debe ser mayor a 0."),
                                        tipo = "entrada" && IsBlank(Trim(txtCieDlg_Texto.Text)), Set(varDlgCieError, "La referencia es obligatoria."),
                                        tipo = "correccion" && IsBlank(Trim(txtCieDlg_Texto.Text)), Set(varDlgCieError, "El motivo es obligatorio."),
                                        Set(varDlgCieError, "");
                                        Switch(
                                            tipo,
                                            "corregir",
                                            With(
                                                {lid: varDlgCie.ID},
                                                Patch(raw_inv_conteo_semanal_linea, LookUp(raw_inv_conteo_semanal_linea, ID = lid), {cantidad: cant, sinExistencia: false, resuelta: true, resueltaPor: NombreRol(varRol), resolucion: "Corregida"});
                                                Patch(colLineas, LookUp(colLineas, ID = lid), {cantidad: cant, sinExistencia: false, resuelta: true, resueltaPor: NombreRol(varRol), resolucion: "Corregida"})
                                            ),
                                            "entrada",
                                            With(
                                                {
                                                    mv: Patch(
                                                        raw_inv_movimiento,
                                                        Defaults(raw_inv_movimiento),
                                                        {
                                                            Title: varConteoId,
                                                            fecha: Now(),
                                                            idinsumo: ins.idinsumo,
                                                            idconcepto: If(drpCieDlg_Tipo.Selected.Value = "Transferencia de entrada", "TRE", "CMP"),
                                                            cantidad: cant,
                                                            costo: ins.costopromedio,
                                                            idalmacen: ins.idalmacen,
                                                            referencia: Trim(txtCieDlg_Texto.Text)
                                                        }
                                                    )
                                                },
                                                // Ajuste de existencia (supuesto P-10), lectura fresca (R-H)
                                                With(
                                                    {iid: ins.idinsumo},
                                                    Patch(raw_inv_insumo, LookUp(raw_inv_insumo, idinsumo = iid), {existencia: LookUp(raw_inv_insumo, idinsumo = iid).existencia + cant})
                                                );
                                                Collect(colMovSemana, mv);
                                                UpdateIf(colRef, idinsumo = ins.idinsumo, {mov: mov + cant})
                                            ),
                                            "correccion",
                                            With(
                                                {ex: LookUp(colLineas, idinsumo = ins.idinsumo), v: Coalesce(varConteo.version_raw, 1) + 1},
                                                Collect(
                                                    raw_inv_conteo_semanal_historial,
                                                    {
                                                        Title: varConteoId & "-v" & v,
                                                        conteoId: varConteoId,
                                                        version_raw: v,
                                                        idinsumo: ins.idinsumo,
                                                        antes: Coalesce(ex.cantidad, 0),
                                                        despues: cant,
                                                        motivo: Trim(txtCieDlg_Texto.Text),
                                                        por: User().FullName,
                                                        el: Now(),
                                                        rol: varRol
                                                    }
                                                );
                                                With(
                                                    {
                                                        r: Patch(
                                                            raw_inv_conteo_semanal_linea,
                                                            Coalesce(ex, Defaults(raw_inv_conteo_semanal_linea)),
                                                            {Title: varConteoId & "-" & ins.idinsumo, conteoId: varConteoId, periodo: varPeriodo, idinsumo: ins.idinsumo, cantidad: cant, sinExistencia: false, resuelta: true, resueltaPor: NombreRol(varRol), resolucion: "Corrección v" & v}
                                                        )
                                                    },
                                                    RemoveIf(colLineas, idinsumo = ins.idinsumo);
                                                    Collect(colLineas, r)
                                                );
                                                Set(varConteo, Patch(raw_inv_conteo_semanal, LookUp(raw_inv_conteo_semanal, id_raw = varConteoId), {estado: "Corregido", version_raw: v}));
                                                ClearCollect(colHist, Filter(raw_inv_conteo_semanal_historial, conteoId = varConteoId))
                                            )
                                        );
                                        Reset(txtCieDlg_Cantidad);
                                        Reset(txtCieDlg_Texto);
                                        Set(varDlgCie, {visible: false, tipo: "", titulo: "", idinsumo: "", ID: 0});
                                        Select(btnCie_Recalcular);
                                        Notify("Guardado", NotificationType.Success)
                                    )
                                )
                              PaddingLeft: =8
                              PaddingRight: =8
                              PressedBorderColor: =Tema.Marca
                              PressedColor: =Tema.Texto
                              PressedFill: =Tema.MarcaHover
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =TipoEtiqueta
                              Text: ="✓ Guardar"
      - btnCie_Recalcular:
          Control: Classic/Button
          Properties:
            BorderColor: =Tema.Borde
            Color: =Tema.Texto
            DisabledBorderColor: =Tema.Borde
            DisabledColor: =Tema.TextoSuave
            DisabledFill: =Tema.SuperficiePresion
            Fill: =Tema.Superficie
            FocusedBorderColor: =Tema.Marca
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =10
            HoverBorderColor: =Tema.Marca
            HoverColor: =Tema.Texto
            HoverFill: =Tema.SuperficieHover
            OnSelect: |-
              =// colCierre: líneas con su disponible y si quedan pendientes (UX02 §03 colPendientes; B-09 supuesto)
              ClearCollect(
                  colCierre,
                  ForAll(
                      colLineas As L,
                      With(
                          {i: LookUp(Insumos, idinsumo = L.idinsumo), rf: LookUp(colRef, idinsumo = L.idinsumo)},
                          With(
                              {disp: If(IsBlank(rf.pasada), Blank(), rf.pasada + rf.mov)},
                              {
                                  ID: L.ID, idinsumo: L.idinsumo, Insumo: i.descripcion, Ab: i.Ab, Costo: i.costopromedio,
                                  cantidad: L.cantidad, sinExistencia: L.sinExistencia, alerta: L.alerta, resuelta: L.resuelta,
                                  resueltaPor: L.resueltaPor, pasada: rf.pasada, mov: rf.mov, disp: disp,
                                  excede: !L.sinExistencia && !IsBlank(disp) && L.cantidad > disp,
                                  pendiente: (!IsBlank(L.alerta) && !L.resuelta) || (!L.sinExistencia && !IsBlank(disp) && L.cantidad > disp)
                              }
                          )
                      )
                  )
              )
            PaddingLeft: =8
            PaddingRight: =8
            PressedBorderColor: =Tema.Marca
            PressedColor: =Tema.Texto
            PressedFill: =Tema.SuperficiePresion
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =TipoEtiqueta
            Text: ="Recalcular"
            Visible: =false
            Width: =10
