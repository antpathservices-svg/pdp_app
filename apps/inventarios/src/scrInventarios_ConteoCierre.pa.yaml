            - conCntCie_Alertas:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =Tema.Borde
                  BorderThickness: =2
                  DropShadow: =DropShadow.None
                  Fill: =Tema.Superficie
                  FillPortions: =0
