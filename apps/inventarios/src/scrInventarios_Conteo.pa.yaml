            OnSelect: |-
              =// Guarda o borra la línea de varLineaPendiente (una escritura por cambio; llave conteoId + idinsumo)
              With(
                  {p: varLineaPendiente, ex: LookUp(colLineas, idinsumo = varLineaPendiente.idinsumo)},
                  If(
                      p.borrar,
                      If(!IsBlank(ex), Remove(raw_inv_conteo_semanal_linea, ex); RemoveIf(colLineas, idinsumo = p.idinsumo)),
                      With(
                          {
                              r: Patch(
                                  raw_inv_conteo_semanal_linea,
                                  Coalesce(ex, Defaults(raw_inv_conteo_semanal_linea)),
                                  {
                                      Title: varConteoId & "-" & p.idinsumo,
                                      conteoId: varConteoId,
                                      periodo: varPeriodo,
                                      idinsumo: p.idinsumo,
                                      cantidad: p.cantidad,
                                      sinExistencia: p.sinExistencia,
                                      alerta: p.alerta,
                                      resuelta: false,
                                      capturadoPor: varRol,
                                      capturadoPersona: User().FullName
                                  }
                              )
                          },
                          RemoveIf(colLineas, idinsumo = p.idinsumo);
                          Collect(colLineas, r)
                      )
                  )
              );
              RemoveIf(colErrCnt, idinsumo = varLineaPendiente.idinsumo);
              Set(varDlgCnt, {visible: false, titulo: "", texto: ""})
