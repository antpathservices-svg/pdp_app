Screens:
  scrInventarios_Conteo:
    Properties:
      Fill: =Tema.Fondo
      OnVisible: |-
        =Set(varConteoId, ConteoIdDe(Today()));
        Set(varPeriodo, PeriodoDe(Today()));
        Set(varPeriodoAnt, PeriodoDe(DateAdd(Today(), -7, TimeUnit.Days)));
        // id_raw = "CS-aaaa-ss": delegable, indexada
        Set(varConteo, LookUp(raw_inv_conteo_semanal, id_raw = varConteoId));
        If(
            IsBlank(varConteo) && varRol in "col,ger,sup",
            Set(
                varConteo,
                Patch(
                    raw_inv_conteo_semanal,
                    Defaults(raw_inv_conteo_semanal),
                    {
                        Title: varConteoId,
                        id_raw: varConteoId,
                        anio: AnioISO(Today()),
                        semana: ISOWeekNum(Today()),
                        del: Text(InicioSemana(Today()), "yyyy-mm-dd"),
                        al: Text(DateAdd(InicioSemana(Today()), 6, TimeUnit.Days), "yyyy-mm-dd"),
                        estado: "Borrador",
                        version_raw: 1,
                        capturadoPersona: User().FullName,
                        capturadoPor: varRol,
                        versionCatalogo: First(Insumos).versionCatalogo
                    }
                )
            )
        );
        Concurrent(
            // conteoId = …: delegable, llave
            ClearCollect(colLineas, Filter(raw_inv_conteo_semanal_linea, conteoId = varConteoId)),
            // periodo entre las 4 semanas anteriores: delegable, indexado
            ClearCollect(colRefLineas, Filter(raw_inv_conteo_semanal_linea, periodo >= PeriodoDe(DateAdd(Today(), -28, TimeUnit.Days)), periodo < varPeriodo)),
            // fecha >= lunes de la semana: delegable, indexada
            ClearCollect(colMovSemana, Filter(raw_inv_movimiento, fecha >= InicioSemana(Today())))
        );
        ClearCollect(
            colRef,
            ForAll(
                Insumos As I,
                With(
                    {pas: LookUp(colRefLineas, idinsumo = I.idinsumo && periodo = varPeriodoAnt)},
                    {
                        idinsumo: I.idinsumo,
                        pasada: If(IsBlank(pas), Blank(), If(pas.sinExistencia, 0, pas.cantidad)),
                        prom4: Average(Filter(colRefLineas, idinsumo = I.idinsumo), If(sinExistencia, 0, cantidad)),
                        mov: Sum(Filter(colMovSemana, idinsumo = I.idinsumo), cantidad)
                    }
                )
            )
        );
        Clear(colErrCnt);
        Set(varDlgCnt, {visible: false, titulo: "", texto: ""})
